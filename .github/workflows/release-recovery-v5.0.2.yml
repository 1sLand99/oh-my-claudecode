name: v5.0.2 Release Recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated release tag
        required: true
        type: string
      sha:
        description: Exact tagged commit SHA
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish exact tagged release
    if: inputs.tag == 'v5.0.2'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-trusted-publish-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact annotated tag
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          git fetch --no-tags --force origin "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}"
          TAG_OBJECT=$(git rev-parse --verify "refs/tags/${{ inputs.tag }}")
          test "$(git cat-file -t "$TAG_OBJECT")" = tag
          test "$(git rev-parse --verify "refs/tags/${{ inputs.tag }}^{}")" = "${{ inputs.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify package and build
        run: |
          test "$(node -p "require('./package.json').version")" = "5.0.2"
          npm run plugin:shipping:verify
          npm run build
          git checkout -- hooks/hooks.json

      - name: Create and verify exact archive
        id: archive
        run: |
          SEED_DIR="$RUNNER_TEMP/seed"
          STAGE="$RUNNER_TEMP/release-stage"
          FINAL_DIR="$RUNNER_TEMP/final"
          EVIDENCE_JSON="$RUNNER_TEMP/release-evidence.json"
          mkdir -p "$SEED_DIR" "$FINAL_DIR"
          SEED_NAME=$(npm pack --ignore-scripts --pack-destination "$SEED_DIR" --silent)
          node scripts/release-boundary.mjs prepare-stage --seed-tarball "$SEED_DIR/$SEED_NAME" --stage "$STAGE" --git-head "${{ inputs.sha }}"
          FINAL_NAME=$(npm pack "$STAGE/package" --ignore-scripts --pack-destination "$FINAL_DIR" --silent)
          FINAL_TARBALL="$FINAL_DIR/$FINAL_NAME"
          node scripts/release-boundary.mjs assert-archive --tarball "$FINAL_TARBALL" --version 5.0.2 --git-head "${{ inputs.sha }}"
          node scripts/release-boundary.mjs write-evidence --tarball "$FINAL_TARBALL" --output "$EVIDENCE_JSON"
          printf 'FINAL_TARBALL=%s\n' "$FINAL_TARBALL" >> "$GITHUB_ENV"
          printf 'EVIDENCE_JSON=%s\n' "$EVIDENCE_JSON" >> "$GITHUB_ENV"

      - name: Publish exact archive with provenance
        run: npm publish "$FINAL_TARBALL" --provenance --access public

      - name: Verify npm publication
        run: |
          test "$(npm view oh-my-claude-sisyphus@5.0.2 version)" = "5.0.2"
          test "$(npm view oh-my-claude-sisyphus@5.0.2 dist.tarball)" != ''

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" --title "oh-my-claudecode ${{ inputs.tag }}" --notes-file .github/release-body.md

      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.tag }}" --json tagName,isDraft,isPrerelease --jq 'select(.tagName == "${{ inputs.tag }}" and .isDraft == false and .isPrerelease == false)'
